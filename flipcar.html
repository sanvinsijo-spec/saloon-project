<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <nav>
            <ul>
                <li><a href="#">Flipkart</a></li>
                <li><input type="search" placeholder="Search for products, brands and more"></li>
                <li><button>Search</button></li>
                <li><a href="#">Login</a></li>
                <li><a href="#">More</a></li>
                <li><a href="#">Cart</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Section -->
    <section class="banner">
        <img src="flipkart-big-billion-days-sale.webp" alt="Banner Image">
    </section>
    <style>
        .banner {
            width: 600px;
            height: 500px;
        }
    </style>

    <!-- Product Section -->
    <section class="products">
        <h2>Top Offers</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="download.jpeg" alt="Product Image">
                <h3>Product Title</h3>
                <p>Product Description</p>
                <button>Add to Cart</button>
            </div>
            <!-- Repeat product-card div for multiple products -->
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2023 Flipkart Clone</p>
    </footer>
</body>
</html>
